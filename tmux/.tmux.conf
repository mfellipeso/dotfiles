# =============================================================================
# General Options
# =============================================================================
set-option -g default-shell "/usr/bin/zsh"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off

# =============================================================================
# Prefix
# =============================================================================
set -g prefix ^A                        # Ctrl + A
set -g prefix2 C-Space                  # Ctrl + Space (secundário)
bind C-Space send-prefix -2

# Reload config
bind q source-file ~/.tmux.conf \; display "Configuration reloaded"

# =============================================================================
# Copy Mode (vim-style)
# =============================================================================
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind p paste-buffer

# =============================================================================
# Keybinds
# =============================================================================
# Splits
bind v split-window -h                  # vertical (lado a lado)
bind h split-window -v                  # horizontal (cima/baixo)

# Kill pane sem confirmacao
bind x kill-pane

# Swap panes (maiúsculo)
bind -r H swap-pane -t '{left-of}'
bind -r J swap-pane -t '{down-of}'
bind -r K swap-pane -t '{up-of}'
bind -r L swap-pane -t '{right-of}'

# Resize panes (Alt + hjkl)
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# =============================================================================
# vim-tmux-navigator (Ctrl+hjkl atravessa nvim <-> panes do tmux, sem prefixo)
# =============================================================================
# Detecta se o pane atual esta rodando (n)vim; se sim, manda o Ctrl+hjkl pra ele,
# senao troca de pane no tmux.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# C-l agora navega pane; restaura o clear-screen via prefixo (C-A C-l)
bind C-l send-keys 'C-l'

# Em copy-mode, hjkl tambem navegam panes
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# =============================================================================
# Theming
# =============================================================================
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=#{?client_prefix,red,blue},bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
